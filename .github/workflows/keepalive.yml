# Бесплатный проект Supabase засыпает после недели без запросов.
# Раз в сутки делаем один запрос — проект считается живым.
# Ключ публичный (тот же, что в index.html), доступ к данным режет RLS.
name: keepalive
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping Supabase
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" \
            "https://wgqrozeqxsnfoiaevcle.supabase.co/rest/v1/voyages?select=id&limit=1" \
            -H "apikey: sb_publishable_dDRrCczBXPVVCnmJtXPAfg_Sij56yJN"
