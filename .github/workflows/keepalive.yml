# Бесплатный проект Supabase засыпает после недели без запросов.
# Раз в сутки дёргаем REST — проект считается живым.
# Нужны две переменные репозитория (Settings → Secrets and variables → Actions → Variables):
#   SUPABASE_URL      — https://xxxx.supabase.co
#   SUPABASE_ANON_KEY — anon public key
name: keepalive
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping Supabase
        run: |
          test -n "${{ vars.SUPABASE_URL }}" || { echo "SUPABASE_URL не задан"; exit 1; }
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" \
            "${{ vars.SUPABASE_URL }}/rest/v1/voyages?select=id&limit=1" \
            -H "apikey: ${{ vars.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ vars.SUPABASE_ANON_KEY }}"
